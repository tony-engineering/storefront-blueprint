# One host, same origin for the browser: /api goes to the API (/api/lab to the load generator),
# everything else to the web app.
# external-dns creates the DNS record; cert-manager gets the TLS certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: storefront-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          {{- if .Values.loadlab.enabled }}
          # Longer prefix wins: the Lab page's load generator.
          - path: /api/lab
            pathType: Prefix
            backend:
              service: { name: loadlab, port: { name: http } }
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
