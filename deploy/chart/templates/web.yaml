# nginx serving the Angular build. Its own /api proxy (frontend/nginx.conf) is for Docker Compose;
# here the Ingress sends /api straight to the api Service, so that location is never reached.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "storefront.image" (dict "root" . "name" "storefront-web") }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
