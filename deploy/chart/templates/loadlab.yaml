{{- if .Values.loadlab.enabled }}
# The load generator behind the Lab page (ARCHITECTURE.md §17). Always ONE replica: it keeps the
# "one test at a time" lock and the run's samples in memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadlab
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    app.kubernetes.io/name: loadlab
spec:
  replicas: 1
  strategy:
    type: Recreate   # never two at once, not even during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: loadlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadlab
    spec:
      {{- include "storefront.scheduling" . | nindent 6 }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadlab
          image: {{ include "storefront.image" (dict "root" . "name" "storefront-loadlab") }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LoadLab__ApiBaseUrl
              value: http://api:8080
          readinessProbe:
            httpGet: { path: /api/lab/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/lab/health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {{- include "storefront.apiSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.loadlab.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loadlab
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
    app.kubernetes.io/name: loadlab
spec:
  selector:
    app.kubernetes.io/name: loadlab
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
