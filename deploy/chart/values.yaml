image:
  registry: rg.fr-par.scw.cloud/storefront
  # The commit SHA; the deploy job sets it with --set image.tag=$GITHUB_SHA.
  tag: ""

host: storefront.tony-engineering.com
ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod

# Runs every storefront pod on the Kapsule pool "storefront", made with the tags
# noprefix=dedicated=storefront (label) and taint=dedicated=storefront:NoSchedule. Kapsule prefixes the
# taint's key but not the label's. Set to null to schedule on any node.
dedicatedNode:
  key: dedicated
  taintKey: k8s.scaleway.com/dedicated
  value: storefront

# The secret CloudNativePG creates for deploy/database.yaml.
database:
  secretName: storefront-db-app

# The migration Job inserts the demo catalog when the products table is empty.
# Turn off for a real shop (ARCHITECTURE.md §8).
seedDemoCatalog: true

api:
  # One replica is enough today. More is safe: orders use xmin optimistic concurrency, and the
  # reconciler charges with the same idempotency key, so two reconcilers can't double-charge.
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

web:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# The load generator behind the Lab page (ARCHITECTURE.md §17). Off: /api/lab then goes to the API and answers 404.
# Keep it at one replica; its lock is in memory.
loadlab:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
