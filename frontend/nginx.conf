server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. With the upstream in a variable, nginx re-resolves "api" instead of
  # keeping the IP it saw at start-up, so recreating the api container doesn't leave a stale 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The Lab page's load generator; more specific than /api/, so it wins.
  location /api/lab/ {
    set $loadlab_upstream http://loadlab:8080;
    proxy_pass $loadlab_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Same origin for the browser: /api is forwarded to the api container, so no CORS.
  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;   # no URI part: the request path is passed through unchanged
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles can be cached forever; index.html must not be.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback for client-side routes.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
