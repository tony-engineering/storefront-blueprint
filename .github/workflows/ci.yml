# CI: runs on every push to main and on pull requests (ARCHITECTURE.md §13).
#
# Four independent chains start together; the only ordering is
# backend-unit -> backend-integration.
#
# Every third-party action is pinned to a full commit SHA, with its version in a
# comment. A tag can be moved to different code; a SHA cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No `concurrency` block on purpose: every push gets its own complete run, and runs never
# cancel each other. With work pushed straight to main, each commit then has a result of its own
# (ARCHITECTURE.md §13), at the cost of some extra runner minutes.

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # setup-dotnet's own cache needs packages.lock.json files, which the repo doesn't use.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Storefront.UnitTests

      - name: Build
        run: dotnet build tests/Storefront.UnitTests --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/Storefront.UnitTests
          --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: backend/TestResults/*.trx
          if-no-files-found: warn

  backend-integration:
    name: backend-integration
    needs: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/Storefront.IntegrationTests

      - name: Build
        run: dotnet build tests/Storefront.IntegrationTests --no-restore --configuration Release

      # Testcontainers starts PostgreSQL through the runner's Docker; ubuntu-latest has it.
      - name: Test
        run: >
          dotnet test tests/Storefront.IntegrationTests
          --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results
          path: backend/TestResults/*.trx
          if-no-files-found: warn

  # Docker builds don't wait for tests: they check packaging, not behaviour, and a
  # failing test should not hide a broken image. Images are tagged with the commit SHA.
  # They are not pushed here: only the deploy job holds registry credentials, and it
  # rebuilds from this job's cache once every test has passed.
  backend-docker:
    name: backend-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build storefront-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          tags: storefront-api:${{ github.sha }}
          cache-from: type=gha,scope=storefront-api
          cache-to: type=gha,scope=storefront-api,mode=max

  # The frontend is built once per run, here: the Dockerfile runs
  # `ng build --configuration production`, so AOT errors and bundle budgets fail this job.
  frontend-docker:
    name: frontend-docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build storefront-web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          tags: storefront-web:${{ github.sha }}
          cache-from: type=gha,scope=storefront-web
          cache-to: type=gha,scope=storefront-web,mode=max

  frontend-unit-lint:
    name: frontend-unit-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  # Continuous deployment to the Scaleway Kapsule cluster (ARCHITECTURE.md §13).
  # Runs only on a push to main, once every other job has passed.
  #
  # Secrets live in the `production` environment, which only main may use: fork PRs and other
  # branches never see them. They reach this job only, never a third-party action: registry login
  # and kubeconfig are plain CLI calls. The API secret key is also the Kubernetes token (Kapsule IAM),
  # so revoking or expiring the key cuts cluster access too.
  deploy:
    name: deploy
    needs: [backend-integration, backend-docker, frontend-docker, frontend-unit-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://storefront.tony-engineering.com
    # One deploy at a time. A newer queued deploy replaces an older queued one; a running one finishes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      REGISTRY: rg.fr-par.scw.cloud/storefront
      NAMESPACE: storefront
      HELM_VERSION: v3.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI has no workflow-level concurrency, so runs can finish out of order. Deploy only the
      # commit that is still the tip of main; a newer commit's own run deploys that one.
      - name: Check this commit is still the tip of main
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $tip; skipping, that commit's run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Scaleway Container Registry
        if: steps.tip.outputs.current == 'true'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud --username nologin --password-stdin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tip.outputs.current == 'true'

      - name: Push storefront-api image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/storefront-api:${{ github.sha }}
          cache-from: type=gha,scope=storefront-api

      - name: Push storefront-web image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/storefront-web:${{ github.sha }}
          cache-from: type=gha,scope=storefront-web

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      # Built from the cluster's public CA and the API secret key. The Scaleway kubeconfig endpoint
      # is not used: it returns the legacy admin token, which outlives the API key.
      - name: Write kubeconfig
        if: steps.tip.outputs.current == 'true'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CLUSTER_ID: ${{ vars.SCW_CLUSTER_ID }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_CLUSTER_CA: ${{ vars.SCW_CLUSTER_CA }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          umask 077
          echo "$SCW_CLUSTER_CA" | base64 -d > "$RUNNER_TEMP/cluster-ca.crt"
          kubectl config set-cluster scw \
            --server="https://${SCW_CLUSTER_ID}.api.k8s.${SCW_REGION}.scw.cloud:6443" \
            --certificate-authority="$RUNNER_TEMP/cluster-ca.crt" --embed-certs
          kubectl config set-credentials ci --token="$SCW_SECRET_KEY"
          kubectl config set-context ci --cluster=scw --user=ci --namespace="$NAMESPACE"
          kubectl config use-context ci
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      # Outside the Helm release on purpose (deploy/database.yaml explains why).
      - name: Apply namespace and database
        if: steps.tip.outputs.current == 'true'
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/database.yaml
          kubectl wait cluster/storefront-db --for=condition=Ready --timeout=10m

      # The pre-upgrade hook runs migrations first. --atomic rolls the pods back if the release
      # does not become ready; it does not roll back the schema.
      - name: Deploy with Helm
        if: steps.tip.outputs.current == 'true'
        run: >
          helm upgrade --install storefront deploy/chart
          --namespace "$NAMESPACE"
          --set image.tag="$GITHUB_SHA"
          --atomic --wait --timeout 10m

      - name: Show cluster state
        if: ${{ failure() && steps.tip.outputs.current == 'true' }}
        run: |
          kubectl get pods,jobs,ingress,certificate -o wide || true
          kubectl logs job/storefront-migrate --tail=100 || true
          kubectl get events --sort-by=.lastTimestamp | tail -30 || true

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/cluster-ca.crt" ~/.docker/config.json
