# Load test: manual only (ARCHITECTURE.md §12, §13 and §17).
#
# A separate workflow so it can never block or slow CI on push. It starts the stack, asks the
# load generator (backend/src/Storefront.LoadLab) to run one test from its catalog, waits for it
# and fails when the run fails or any audit check fails. The same load generator serves the Lab page.

name: Load test

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test to run"
        type: choice
        default: flash-sale
        options:
          - steady
          - flash-sale
          - ramp
          - outage
          - slow-provider
          - retry-storm

# One load test at a time: two runs on the same runner pool would skew each other's numbers.
concurrency:
  group: load-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load-test:
    name: load-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Inputs go through env rather than ${{ }} in scripts, so they can't inject shell.
      TEST: ${{ inputs.test }}
      API_URL: http://localhost:8080
      LAB_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stack
        run: docker compose up -d --build api loadlab

      - name: Wait for the API and the load generator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health" > /dev/null && curl -fsS "$LAB_URL/api/lab/health" > /dev/null; then
              echo "Healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The stack did not report healthy within 120s"
          exit 1

      - name: Run the test
        run: |
          curl -fsS -X POST "$LAB_URL/api/lab/runs" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TEST" '{testId: $t}')" > started.json
          run_id="$(jq -r .id started.json)"
          echo "Run $run_id of $TEST"

          # The slowest tests take about 2 min to send, then up to 4 min to settle.
          for i in $(seq 1 450); do
            curl -fsS "$LAB_URL/api/lab/runs/$run_id" > run.json
            phase="$(jq -r .phase run.json)"
            echo "$(date +%T) $phase $(jq -r .percent run.json)%"
            if [[ "$phase" == "Done" || "$phase" == "Failed" ]]; then
              break
            fi
            sleep 2
          done

          jq '{phase, error, audit}' run.json
          if [[ "$(jq -r .phase run.json)" != "Done" ]]; then
            echo "::error::The run did not finish: $(jq -r '.error // .phase' run.json)"
            exit 1
          fi
          if [[ "$(jq '[.audit[] | select(.result != "pass")] | length' run.json)" != "0" ]]; then
            echo "::error::At least one audit check failed"
            exit 1
          fi

      - name: Upload the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-run
          path: run.json
          if-no-files-found: warn

      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
